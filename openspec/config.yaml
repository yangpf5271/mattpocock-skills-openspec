schema: spec-driven

# Project context (shown to AI when creating artifacts).
context: |
  This repo is "mattpocock-skills" — Matt Pocock's agent skills for real
  engineering, shipped as a Claude Code plugin (see .claude-plugin/) and via
  `npx skills add`. The "product" is a set of markdown SKILL.md prompt files
  under skills/<bucket>/, not application code.

  Tech stack / conventions:
  - Skills are markdown prompt files (SKILL.md), organized into bucket folders
    under skills/ (engineering/, productivity/ are "promoted"; misc/, personal/,
    in-progress/, deprecated/ are not).
  - Plugin manifest: .claude-plugin/plugin.json (skills[] array). Bump its
    `version` in lockstep with package.json on release, then run
    `claude plugin validate . --strict`.
  - Every promoted skill must also be listed in the root README.md and its
    bucket README.md, and have a docs page at docs/<bucket>/<skill-name>.md.
  - Release/versioning: changesets (@changesets/cli).
  - Local install (maintainers only): scripts/link-skills.sh symlinks each
    skills/*/SKILL.md into ~/.claude/skills and ~/.agents/skills.
  - Router skill: skills/engineering/ask-matt maps every user-reachable skill.

# Per-artifact rules (optional).
rules:
  proposal:
    - Keep the Problem Statement in user-facing terms; no file paths or code.
    - Reference the grilling / to-spec thread it synthesizes, if any.
  tasks:
    - Prefer vertical tracer-bullet slices that match /to-tickets output.
